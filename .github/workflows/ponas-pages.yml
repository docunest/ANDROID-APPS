name: Ponas games

# Validates every game and publishes https://docunest.github.io/ANDROID-APPS/ponas/ :
# the iPhone/browser web app and manifest.json, which the tablet syncs from.
# Also publishes the Reelbox web app at /reelbox/ and its native app for Expo Go at
# /reelbox/app/ (GitHub Pages is one site per repo,
# so every app's pages are built here together).
on:
  push:
    branches: [main]
    paths:
      - "ponas/games/**"
      - "ponas/sdk/**"
      - "ponas/tools/**"
      - "ponas/web/**"
      - "reelbox/src/**"
      - "reelbox/public/**"
      - "reelbox/index.html"
      - "reelbox/package*.json"
      - "reelbox/vite.config.ts"
      - "reelbox/native/**"
      - ".github/workflows/ponas-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git history gives each game its "updated" date

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site (validates every game)
        run: |
          node ponas/tools/build-site.mjs --out _site/ponas
          # Repo root of the Pages site just points to Ponas (other apps may get pages later).
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=ponas/"><a href="ponas/">Ponas</a>\n' > _site/index.html
          touch _site/.nojekyll
          find _site -type f | sort

      - name: Build Reelbox web app (iPhone / Mac / browser)
        working-directory: reelbox
        env:
          VITE_API_URL: ${{ vars.REELBOX_API_URL }}
        run: |
          npm ci
          npm run build
          mkdir -p ../_site/reelbox
          cp -r dist/. ../_site/reelbox/

      # The native iPhone/Android app, opened in Expo Go from /reelbox/app/ (no App Store build).
      - name: Build Reelbox native app for Expo Go
        working-directory: reelbox/native
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.REELBOX_API_URL }}
          PUBLIC_URL: https://docunest.github.io/ANDROID-APPS/reelbox/app
          CI: "1"
        run: |
          npm ci
          npx tsc --noEmit
          npx expo export --platform ios --platform android --output-dir ../../_site/reelbox/app
          node scripts/publish-pages.mjs ../../_site/reelbox/app

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
