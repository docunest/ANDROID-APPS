name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      PONAS_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "PONAS_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "PONAS_VERSION_NAME=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ponas-release.jks"
            echo "PONAS_KEYSTORE=$RUNNER_TEMP/ponas-release.jks" >> "$GITHUB_ENV"
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set, so only the debug APK is built. See README → One-time setup."
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Tagged releases need the signing secrets."
              exit 1
            fi
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/ponas-debug.apk"
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/app-release.apk"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/out/app-release.apk" | tee "$GITHUB_WORKSPACE/out/signing-cert.txt"
          fi
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: ponas-apk
          path: out/app-release.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ponas-debug-apk
          path: out/ponas-debug.apk

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/app-release.apk
          generate_release_notes: true
