name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      PONAS_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "PONAS_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "PONAS_VERSION_NAME=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      # Needs repository secrets (Settings → Secrets and variables → Actions → *Repository* secrets):
      #   KEYSTORE_BASE64   base64 of ponas-release.jks      (required)
      #   KEYSTORE_PASSWORD the keystore password             (required)
      #   KEY_ALIAS         optional, defaults to "ponas"
      #   KEY_PASSWORD      optional, defaults to KEYSTORE_PASSWORD (same thing for PKCS12)
      - name: Decode and check signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret is not set (or not a *Repository* secret under Actions), so only the debug APK is built. See README → One-time setup."
            [[ "$GITHUB_REF" == refs/tags/v* ]] && fail "Tagged releases need the signing secrets."
            exit 0
          fi
          [ -n "$KEYSTORE_PASSWORD" ] || fail "KEYSTORE_BASE64 is set but KEYSTORE_PASSWORD is missing."
          ALIAS="${KEY_ALIAS:-ponas}"
          KPASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          JKS="$RUNNER_TEMP/ponas-release.jks"
          # Tolerate line breaks, spaces and Windows CRs from copy-paste.
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$JKS" 2>/dev/null \
            || fail "KEYSTORE_BASE64 is not valid base64. Re-copy it with: base64 -i ponas-release.jks | pbcopy"
          [ -s "$JKS" ] || fail "KEYSTORE_BASE64 decoded to an empty file."
          keytool -list -keystore "$JKS" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1 \
            || fail "Cannot open the keystore: KEYSTORE_PASSWORD is wrong, or KEYSTORE_BASE64 is not the ponas-release.jks file."
          keytool -list -keystore "$JKS" -storepass "$KEYSTORE_PASSWORD" -alias "$ALIAS" >/dev/null 2>&1 \
            || fail "Keystore opened, but it has no key named \"$ALIAS\". Aliases in it: $(keytool -list -keystore "$JKS" -storepass "$KEYSTORE_PASSWORD" | grep -E 'Entry,' | cut -d, -f1 | tr '\n' ' ')"
          echo "Keystore OK (alias $ALIAS)."
          {
            echo "PONAS_KEYSTORE=$JKS"
            echo "HAS_KEYSTORE=true"
          } >> "$GITHUB_ENV"
          # Pass alias/key password on with defaults applied (masked in logs).
          echo "::add-mask::$KPASS"
          {
            echo "PONAS_KEY_ALIAS=$ALIAS"
            echo "PONAS_KEY_PASSWORD=$KPASS"
          } >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # Without secrets this still runs (unsigned) so the minified release build is checked.
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: KEY_ALIAS="$PONAS_KEY_ALIAS" KEY_PASSWORD="$PONAS_KEY_PASSWORD" ./gradlew --no-daemon assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/ponas-debug.apk"
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/app-release.apk"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/out/app-release.apk" | tee "$GITHUB_WORKSPACE/out/signing-cert.txt"
          fi
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: ponas-apk
          path: out/app-release.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ponas-debug-apk
          path: out/ponas-debug.apk

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/app-release.apk
          generate_release_notes: true
