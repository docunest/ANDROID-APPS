<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GAME_TITLE</title>
<style>
  body { background: #FFF6E0; font-family: sans-serif; --size: min(40vmin, 200px); }
  /* Keep the top 72px free: ponas.js puts the pause (left) and close (right) buttons there. */
  #game { position: fixed; left: 0; right: 0; top: 72px; bottom: 0;
    display: flex; flex-direction: row; align-items: center; justify-content: space-evenly; }
  @media (orientation: portrait) { #game { flex-direction: column; } }
  .target { width: var(--size); height: var(--size); border-radius: 30px; background: #FF7043;
    box-shadow: 0 6px 0 #00000022; transition: transform .12s; }
  .target:active { transform: scale(.92); }
  #count { display: flex; gap: 6px; flex-wrap: wrap; max-width: var(--size); }
  #count i { width: 22px; height: 22px; border-radius: 50%; background: #FFB300; }
</style>
</head>
<body>
<div id="game">
  <div class="target" id="target"></div>
  <div id="count"></div>
</div>
<!-- ponas.js is added by tools/build-site.mjs: pause/close buttons, ▶ start overlay, sound, storage. -->
<script src="ponas.js"></script>
<script>
(function () {
  'use strict';
  var P = window.Ponas;
  var taps = P.load('taps', 0);            // saved as "GAME_ID:taps"
  var countEl = document.getElementById('count');

  function draw() {
    countEl.innerHTML = '';
    for (var i = 0; i < taps % 10; i++) countEl.appendChild(document.createElement('i'));
  }

  document.getElementById('target').addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (P.paused) return;
    taps++; P.save('taps', taps); draw();
    P.tone(523, { dur: 0.2 }); P.tone(784, { delay: 0.12, dur: 0.3 });
  });

  P.onStart(function () { /* start music, timers, first prompt… */ });
  P.onPause(function () { /* stop timers/loops */ });
  P.onResume(function () { /* restart them */ });
  draw();
})();
</script>
</body>
</html>
