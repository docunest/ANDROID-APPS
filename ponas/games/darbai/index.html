<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Darbai</title>
<link rel="stylesheet" href="kit.css">
<style>
  body { background: #E8F5E9; font-family: sans-serif; --c: min(21vw, 30vh, 130px); }
  #game { position: fixed; left: 0; right: 0; top: 72px; bottom: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: space-evenly; padding: 0 8px 8px; }
  .row { display: flex; gap: min(3vw, 14px); justify-content: center; }
  .slot { width: var(--c); height: var(--c); border-radius: 18px; border: 3px dashed #81C784; position: relative;
    display: flex; align-items: center; justify-content: center; }
  .slot .num { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; width: 50%; }
  .slot .num i { width: 12px; height: 12px; border-radius: 50%; background: #81C784; }
  .card { width: var(--c); height: var(--c); border-radius: 18px; background: #fff; box-shadow: 0 5px 0 #00000020;
    display: flex; align-items: center; justify-content: center; font-size: calc(var(--c) * .58); line-height: 1; }
  .slot .card { position: absolute; inset: -3px; box-shadow: 0 3px 0 #00000020; }
  .fly { transition: transform .45s cubic-bezier(.3,.7,.3,1); }
  .gone { visibility: hidden; }
  /* sorting */
  #item { font-size: min(22vmin, 110px); line-height: 1; width: min(30vmin, 140px); height: min(30vmin, 140px);
    background: #fff; border-radius: 24px; box-shadow: 0 5px 0 #00000020; display: flex; align-items: center; justify-content: center; }
  .bin { width: min(21vw, 30vh, 112px); height: min(26vw, 36vh, 138px); position: relative; border-radius: 10px 10px 16px 16px;
    background: var(--b); box-shadow: inset -8px 0 0 #00000022, 0 5px 0 #00000025; }
  .bin::before { content: ""; position: absolute; left: -6%; right: -6%; top: -9%; height: 14%; border-radius: 8px;
    background: var(--b); box-shadow: inset 0 -4px 0 #00000033; }
  .bin::after { content: ""; position: absolute; left: 30%; right: 30%; top: 22%; height: 8%; border-radius: 6px; background: #00000055; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="stars"></div>
<div id="game">
  <div id="seq" class="hidden" style="display:contents">
    <div class="row" id="slots"></div>
    <div class="row" id="cards"></div>
  </div>
  <div id="sort" class="hidden" style="display:contents">
    <div id="item"></div>
    <div class="row" id="bins"></div>
  </div>
</div>
<script src="ponas.js"></script>
<script src="kit.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
