<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Žemėlapis</title>
<link rel="stylesheet" href="kit.css">
<style>
  body { background: #E1F5FE; font-family: sans-serif; }
  #game { position: fixed; left: 0; right: 0; top: 72px; bottom: 0; }
  #map { position: absolute; }
  #map .sea { fill: #81D4FA; }
  #map .land { fill: #E0E0E0; stroke: #BDBDBD; stroke-width: 2; }
  #map .slot { fill: #FFFFFF99; stroke: #607D8B; stroke-width: 3; stroke-dasharray: 10 7; }
  #map .slot.full { fill: none; stroke: none; }
  .piece { position: absolute; left: 0; top: 0; touch-action: none; will-change: transform; transform-origin: 0 0; }
  .piece path { stroke: #fff; stroke-width: 3; stroke-linejoin: round; }
  .piece.placed { pointer-events: none; }
  .piece.back { transition: transform .35s ease-out; }
  .dot { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; display: flex; align-items: center; justify-content: center; }
  .dot i { width: 26px; height: 26px; border-radius: 50%; background: #E53935; border: 4px solid #fff; box-shadow: 0 2px 0 #00000040; }
  .dot.ok i { background: #43A047; }
  #photo { position: absolute; border-radius: 22px; overflow: hidden; background: #fff; box-shadow: 0 5px 0 #00000025; border: 5px solid #fff; }
  #photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="stars"></div>
<div id="game">
  <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="photo" class="hidden"><img alt=""></div>
</div>
<script src="ponas.js"></script>
<script src="kit.js"></script>
<script src="mapdata.js"></script>
<script src="game.js"></script>
</body>
</html>
