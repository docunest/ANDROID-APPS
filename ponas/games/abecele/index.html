<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Abėcėlė</title>
<style>
  body { background: linear-gradient(#FFF3C4, #FFFBEA); font-family: Georgia, 'Times New Roman', serif; color: #4E342E;
    --nav: min(25vmin, 96px); }

  #game { position: fixed; top: 72px; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }

  /* big pair + arrows */
  #stage { flex: 1 1 auto; min-height: 0; display: grid; align-items: center; justify-items: center;
    grid-template-columns: auto 1fr auto; grid-template-areas: "prev card next"; gap: 2vmin; padding: 0 2vmin 10px; }
  @media (orientation: portrait) {
    #stage { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr auto;
      grid-template-areas: "card card" "prev next"; padding: 0 4vmin 1vmin; }
  }
  #prev { grid-area: prev; } #next { grid-area: next; }
  .nav { width: var(--nav); height: var(--nav); border-radius: 50%; border: 0; padding: 0;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 #00000022;
    transition: transform .12s; }
  .nav:active { transform: scale(.9); }
  .nav svg { width: 56%; height: 56%; }
  #prev { background: #FFB74D; } #next { background: #66BB6A; }

  #card { grid-area: card; width: 100%; max-width: 440px; height: 100%; max-height: 210px;
    background: #fff; border-radius: 34px; box-shadow: 0 8px 0 #00000018;
    display: flex; align-items: center; justify-content: center; gap: 5vmin; }
  #card span { font-weight: 800; line-height: 1.2; font-size: min(32vmin, 150px); }
  #up { color: #FF7043; } #lo { color: #6D4C41; }
  #card.pop { animation: pop .35s ease-out; }

  /* progress strip: every pair in order, current one lit (display only) */
  #strip { flex: 0 0 auto; display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px;
    padding: 0 8px 8px; pointer-events: none; }
  @media (orientation: portrait) { #strip { grid-template-columns: repeat(8, 1fr); gap: 4px; padding: 0 8px 12px; } }
  .cell { text-align: center; border-radius: 8px; background: #ffffffaa; font-weight: 700; font-size: 15px;
    padding: 4px 0; color: #8D6E63; transition: transform .2s, background-color .2s; }
  @media (orientation: portrait) { .cell { font-size: 19px; padding: 6px 0; } }
  .cell.done { background: #C8E6C9; color: #2E7D32; }
  .cell.cur { background: #FF7043; color: #fff; transform: scale(1.12); }

  @keyframes pop { 0% { transform: scale(.85); opacity: .5; } 60% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); } }
</style>
</head>
<body>
<div id="game">
  <div id="stage">
    <button class="nav" id="prev" aria-label="back">
      <svg viewBox="0 0 24 24"><path d="M15 4L7 12l8 8" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div id="card"><span id="up">A</span><span id="lo">a</span></div>
    <button class="nav" id="next" aria-label="next">
      <svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div id="strip"></div>
</div>
<!-- ponas.js is added by tools/build-site.mjs: pause/close buttons, ▶ start overlay, sound, storage. -->
<script src="ponas.js"></script>
<script src="game.js"></script>
</body>
</html>
