<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Minos</title>
<style>
  body { background: linear-gradient(#B3E5FC, #E1F5FE); font-family: sans-serif; --cell: 64px; }
  /* stars sit between the pause (left) and close (right) buttons; the time bar is under them */
  #stars { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
  .star { width: 28px; height: 28px; background: #ffffffaa;
    clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    transition: transform .3s; }
  .star.on { background: #FFC107; transform: scale(1.15); }

  #game { position: fixed; left: 0; right: 0; top: 72px; bottom: 0;
    display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 4vmin; padding: 0 8px 8px; }
  @media (orientation: portrait) { #game { flex-direction: column; } }

  #board { display: grid; gap: 4px; padding: 6px; border-radius: 18px; background: #6D4C41;
    box-shadow: 0 6px 0 #00000030; flex: 0 0 auto; }
  .cell { width: var(--cell); height: var(--cell); border-radius: 12px; position: relative;
    display: flex; align-items: center; justify-content: center; }
  .cell.hid { background: #7CB342; box-shadow: inset 0 -6px 0 #558B2F; }
  .cell.hid:nth-child(odd) { background: #8BC34A; }
  .cell.open { background: #FFE0B2; box-shadow: inset 0 3px 0 #00000018; animation: open .25s ease-out; }
  .cell.boom { background: #FFCDD2; }
  .cell svg { width: 72%; height: 72%; pointer-events: none; }
  .cell.wiggle { animation: wiggle .7s ease-in-out 2; }
  .cell.shake { animation: shake .45s; }
  .dots { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    width: 74%; height: 74%; pointer-events: none; }
  .dots span { display: flex; align-items: center; justify-content: center; }
  .dots i { display: block; width: 74%; aspect-ratio: 1; border-radius: 50%; background: var(--dc); }

  #tools { display: flex; flex-direction: column; gap: 14px; flex: 0 0 auto; }
  @media (orientation: portrait) { #tools { flex-direction: row; } }
  .tool { width: 86px; height: 86px; border-radius: 24px; background: #ffffffcc; box-shadow: 0 5px 0 #00000025;
    display: flex; align-items: center; justify-content: center; transition: transform .15s, background-color .15s; }
  .tool svg { width: 66%; height: 66%; pointer-events: none; }
  .tool.on { background: #FFD54F; transform: scale(1.08); box-shadow: 0 0 0 5px #fff, 0 5px 0 5px #00000025; }

  .spark { position: fixed; width: 18px; height: 18px; background: #FFD54F; pointer-events: none; z-index: 40;
    clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    transition: transform .7s ease-out, opacity .7s ease-out; }
  @keyframes open { from { transform: scale(.7); } to { transform: scale(1); } }
  @keyframes wiggle { 0%, 100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-8deg) scale(1.08); } 75% { transform: rotate(8deg) scale(1.08); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(7px); } 75% { transform: translateX(-4px); } }
</style>
</head>
<body>
<div id="stars"></div>
<div id="game">
  <div id="board"></div>
  <div id="tools">
    <div class="tool on" id="t-dig"></div>
    <div class="tool" id="t-flag"></div>
  </div>
</div>
<script src="ponas.js"></script>
<script src="laikas.js"></script>
<script src="game.js"></script>
</body>
</html>
