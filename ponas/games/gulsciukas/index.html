<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gulsčiukas</title>
<style>
  body { background: #F1F8E9; font-family: system-ui, sans-serif; color: #263238;
    --btn: min(17vmin, 72px); --fs: min(4.2vmin, 18px); }
  /* top strip middle: mode + online dot (pause/close buttons sit left/right) */
  #top { position: fixed; top: 16px; left: 72px; right: 72px; height: 40px; display: flex; align-items: center;
    justify-content: center; gap: 8px; font-size: 15px; font-weight: 700; color: #33691E; pointer-events: none; }
  #dot { width: 12px; height: 12px; border-radius: 50%; background: #B0BEC5; display: none; }
  #dot.show { display: block; } #dot.on { background: #43A047; }
  #game { position: fixed; left: 0; right: 0; top: 72px; bottom: 0; display: flex; flex-direction: row; }
  @media (orientation: portrait) { #game { flex-direction: column; } }
  #left { position: relative; flex: 1 1 40%; min-width: 0; min-height: 0; overflow: hidden; }
  #right { flex: 1 1 60%; min-width: 0; min-height: 0; display: flex; flex-direction: column;
    justify-content: space-evenly; padding: 0 8px 6px 4px; box-sizing: border-box; }
  @media (orientation: portrait) { #left { flex: 1 1 47%; } #right { flex: 1 1 53%; } }

  #cv { position: absolute; inset: 0; width: 100%; height: 100%; }
  #cv .body { fill: #ECEFF1; stroke: #546E7A; }
  #cv .bar { fill: none; stroke: #455A64; stroke-linejoin: round; }
  #cv .hitch { fill: #455A64; }
  #cv .wheel { fill: #37474F; }
  #cv .leg { fill: #FB8C00; }
  #cv .win { fill: #B3E5FC; }
  #cv .ring { fill: #DCEDC8; stroke: #558B2F; }
  #cv .ring0 { fill: none; stroke: #558B2F; stroke-dasharray: .06 .05; }
  #bubble circle { fill: #FFEB3B; stroke: #F9A825; }
  #bubble.ok circle { fill: #66BB6A; stroke: #2E7D32; }
  .pt { position: absolute; left: 0; top: 0; font-size: calc(var(--fs) * .85); font-weight: 800; white-space: nowrap;
    background: #fffe; border: 2px solid #B0BEC5; border-radius: 8px; padding: 1px 5px; color: #37474F;
    font-variant-numeric: tabular-nums; will-change: transform; }
  .pt.ok { border-color: #43A047; color: #2E7D32; }
  .pt.hi { border-color: #E53935; color: #C62828; }
  #legend { position: absolute; left: 6px; bottom: 4px; font-size: 11px; color: #607D8B; pointer-events: none; }
  #perm { position: absolute; inset: 8px; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; text-align: center; background: #fffe; border-radius: 14px; font-size: var(--fs); }
  #perm.show { display: flex; }
  #permBtn { min-height: 64px; padding: 0 22px; font-size: var(--fs); font-weight: 700; border: 0; border-radius: 14px;
    background: #43A047; color: #fff; box-shadow: 0 4px 0 #2E7D32; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { font-size: 11px; font-weight: 600; color: #78909C; text-align: right; padding: 0 4px; }
  td { font-size: var(--fs); text-align: right; padding: 2px 4px; white-space: nowrap; }
  td.ax { text-align: left; font-weight: 800; font-size: calc(var(--fs) * 1.15); color: #33691E; }
  td.rel { font-weight: 800; font-size: calc(var(--fs) * 1.15); }
  #sum { font-size: calc(var(--fs) * .8); color: #4E342E; line-height: 1.35; }
  #sum b { color: #3E2723; }
  #status { font-size: 12px; color: #546E7A; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 22px; }
  #room { display: none; align-items: center; gap: 4px; }
  #room.show { display: flex; }
  #roomIn { width: 64px; height: 30px; font-size: 16px; text-align: center; border: 2px solid #8BC34A; border-radius: 8px; }
  #btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .b { height: var(--btn); border: 0; border-radius: 14px; font-size: calc(var(--fs) * .85); font-weight: 800;
    color: #fff; background: #7CB342; box-shadow: 0 4px 0 #558B2F; padding: 0 2px; line-height: 1.1;
    touch-action: manipulation; transition: transform .1s; }
  .b:active { transform: translateY(3px); }
  .b small { display: block; font-weight: 600; font-size: 10px; opacity: .9; }
  #bZero { background: #FB8C00; box-shadow: 0 4px 0 #E65100; }
  #bMode { background: #1E88E5; box-shadow: 0 4px 0 #1565C0; }
  .b.off { opacity: .4; }
</style>
</head>
<body>
<div id="top"><span id="dot"></span><span id="modeLbl">Vietinis</span></div>
<div id="game">
  <div id="left">
    <!-- caravan top view in metres: x = right, y = −(forward − 3.6); rear at y=3.6, hitch at y=−3.6 -->
    <svg id="cv" xmlns="http://www.w3.org/2000/svg">
      <g id="car" vector-effect="non-scaling-stroke">
        <path class="bar" d="M-0.75 -1.3 L0 -3.45 L0.75 -1.3" stroke-width="0.09"/>
        <circle class="hitch" cx="0" cy="-3.55" r="0.14"/>
        <rect class="wheel" x="-1.36" y="1.0" width="0.24" height="0.6" rx="0.06"/>
        <rect class="wheel" x="1.12" y="1.0" width="0.24" height="0.6" rx="0.06"/>
        <rect class="body" x="-1.1" y="-1.3" width="2.2" height="4.9" rx="0.22" stroke-width="0.06"/>
        <rect class="win" x="-0.7" y="-1.22" width="1.4" height="0.16" rx="0.05"/>
        <rect class="leg" x="-1.08" y="-1.28" width="0.24" height="0.24" rx="0.04"/>
        <rect class="leg" x="0.84" y="-1.28" width="0.24" height="0.24" rx="0.04"/>
        <rect class="leg" x="-1.08" y="3.34" width="0.24" height="0.24" rx="0.04"/>
        <rect class="leg" x="0.84" y="3.34" width="0.24" height="0.24" rx="0.04"/>
        <circle class="ring" cx="0" cy="1.15" r="0.75" stroke-width="0.04"/>
        <circle class="ring0" cx="0" cy="1.15" r="0.24" stroke-width="0.03"/>
        <g transform="translate(0 1.15)"><g id="bubble"><circle r="0.2" stroke-width="0.04"/></g></g>
      </g>
    </svg>
    <div class="pt" id="p0"></div><div class="pt" id="p1"></div><div class="pt" id="p2"></div><div class="pt" id="p3"></div>
    <div class="pt" id="p4"></div><div class="pt" id="p5"></div><div class="pt" id="p6"></div>
    <div id="legend">↑ kiek kelti, cm</div>
    <div id="perm"><div id="permTxt">Reikia leidimo naudoti judesio jutiklius</div><button id="permBtn">Leisti jutiklius</button></div>
  </div>
  <div id="right">
    <table>
      <tr><th></th><th>Absoliutus</th><th>Nuo nulio</th></tr>
      <tr><td class="ax">X</td><td id="ax"></td><td class="rel" id="rx"></td></tr>
      <tr><td class="ax">Y</td><td id="ay"></td><td class="rel" id="ry"></td></tr>
      <tr><td class="ax">Z</td><td id="az"></td><td class="rel" id="rz"></td></tr>
    </table>
    <div id="sum"></div>
    <div id="status"><span id="room">Kambarys <input id="roomIn" type="number" inputmode="numeric" min="1" max="9999"></span><span id="stat"></span></div>
    <div id="btns">
      <button class="b" id="bZero">Nulis</button>
      <button class="b" id="bClear">Absoliutus</button>
      <button class="b" id="bMode">Režimas<small id="bModeS">vietinis</small></button>
      <button class="b" id="bSwap">⟳ Telefonas<small id="bSwapS">viršus → kablys</small></button>
    </div>
  </div>
</div>
<script src="ponas.js"></script>
<script src="game.js"></script>
</body>
</html>
