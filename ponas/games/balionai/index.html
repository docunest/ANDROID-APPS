<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Balionai</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>

  <!-- progress: 5 stars, no timer, no penalty -->
  <div id="stars"></div>

  <!-- the number to find, shown as dots; tap it to hear the count again -->
  <div id="card" aria-label="Kiek taškų?"><div class="dots"></div></div>

  <div id="balloons"></div>

  <!-- first tap unlocks sound -->
  <div id="start"><div class="play"></div></div>
</div>
<script src="game.js"></script>
</body>
</html>
