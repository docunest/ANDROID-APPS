<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bokštas</title>
<link rel="stylesheet" href="kit.css">
<style>
  body { background: #F6EFE4; font-family: sans-serif; }
  #game { position: fixed; left: 0; right: 0; top: 72px; bottom: 0; display: flex; flex-direction: row; }
  @media (orientation: portrait) { #game { flex-direction: column; } }
  #build { flex: 0 0 38%; position: relative; display: flex; align-items: flex-end; justify-content: center; padding: 6px 6px 14px; }
  #build::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: 8px; height: 6px; border-radius: 3px; background: #C8B49A; }
  #stack { display: flex; flex-direction: column-reverse; align-items: center; position: relative; z-index: 1; margin-bottom: 6px; }
  #stack.row { flex-direction: row; align-items: flex-end; gap: 4px; }
  #tray { flex: 1 1 auto; position: relative; margin: 6px; border-radius: 22px; background: #EADCC8; }
  .it { position: absolute; border-radius: 4px; box-shadow: inset -4px -4px 0 #0000001a, 0 3px 0 #00000026; }
  .it::before { content: ""; position: absolute; inset: -10px; }      /* bigger touch area than the cube */
  .it.cube { background: #F48FB1; }
  .it.board { background: #8D6E63; border-radius: 3px; }
  .it.tab { border-radius: 8px; box-shadow: 0 3px 0 #00000026; border: 3px solid #ffffffaa; }
  #stack .it { position: relative; left: auto !important; top: auto !important; }
  .fly { transition: transform .45s cubic-bezier(.3,.7,.3,1); }
</style>
</head>
<body>
<div id="stars"></div>
<div id="game">
  <div id="build"><div id="stack"></div></div>
  <div id="tray"></div>
</div>
<script src="ponas.js"></script>
<script src="kit.js"></script>
<script src="game.js"></script>
</body>
</html>
